name: Devora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Install client dependencies
        run: |
          cd client
          npm install

      - name: ✅ Build client
        run: |
          cd client
          npm run build

      - name: 📦 Install server dependencies
        run: |
          cd server
          npm install

      - name: ✅ Lint server (optional)
        run: |
          cd server
          npm run lint || echo 'No lint script yet'
